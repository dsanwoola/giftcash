name: Deploy to App Hosting

# Auto-deploys the GiftCash App Hosting backend on every push to main.
# Requires a repo secret FIREBASE_SERVICE_ACCOUNT — a Google service-account
# JSON key with App Hosting deploy permissions (see README / repo settings).
# App Hosting builds in the cloud and only shifts traffic on a successful build,
# so a bad push fails safely without taking production down.

on:
  push:
    branches:
      - main

# Cancel an in-flight deploy if a newer commit lands.
concurrency:
  group: apphosting-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy App Hosting backend
        run: npx --yes firebase-tools@15.20.0 deploy --only apphosting --project giftcash-d0f57 --non-interactive
